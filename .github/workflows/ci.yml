name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (unit, property, gold, integration)
        run: cargo test

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins "stable", which would silently override the
      # toolchain installed above, so name 1.85 explicitly. Libraries and
      # binaries only: the dev-dependency proptest 1.12 needs Rust 1.88.
      - run: cargo +1.85 check --lib --bins

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  package:
    name: Publishable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each crate carries what it embeds (the R4 schema, the fonts, the
      # example importer), so all three package and build on their own.
      - run: cargo package -p recordchaos-core -p recordchaos-report -p recordchaos
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python source package builds
        run: |
          python -m pip install "maturin>=1.16,<2"
          (cd python && maturin sdist -o ../sdist)
          python -m pip wheel --no-deps sdist/*.tar.gz -w wheels

  licences:
    name: Third-party licences (cargo-about)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # The release build makes the same file (.github/build-setup.yml); this
      # job fails early when a dependency's licence is not accepted.
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v6
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.html

  demo:
    name: Demo run against the example importer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example buggy_importer
      - name: Buggy importer (expect exit 1, four findings)
        run: |
          set +e
          cargo run -- run scenarios/demo.toml --target examples/targets/buggy-importer.toml --out results --color never
          code=$?
          set -e
          test "$code" -eq 1
          # The four seeded bugs, each shrunk to one mutation.
          test "$(jq '.findings | length' results/results.json)" -eq 4
          test "$(jq '[.findings[] | select(.mutations_after == 1)] | length' results/results.json)" -eq 4
      - name: Replay every finding
        run: |
          # Each finding's representative case still fails with the same
          # fingerprint (exit 1); any other exit code fails the job.
          for dir in $(jq -r '.findings[].representative' results/results.json); do
            set +e
            cargo run -q -- --json replay "results/cases/$dir" --color never > replay.json
            code=$?
            set -e
            test "$code" -eq 1
            test "$(jq '.same_fingerprint' replay.json)" = "true"
          done
      - name: Fixed importer (expect exit 0)
        run: cargo run -- run scenarios/demo.toml --target examples/targets/fixed-importer.toml --out results-fixed --color never
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: demo-results
          path: |
            results/
            results-fixed/

  python:
    name: Python plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip "maturin>=1.16,<2" "pytest>=9.2"
          python -m pip install ./python
      - name: Plugin tests
        run: python -m pytest -p pytester python/tests -q

  strict:
    name: Strict layer (HL7 validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache validator_cli.jar
        uses: actions/cache@v4
        with:
          path: validator_cli.jar
          key: hl7-validator-7.0.6
      - name: Download validator_cli.jar 7.0.6
        run: test -f validator_cli.jar || sh scripts/fetch-validator.sh 7.0.6
      - name: Cache the validator's FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-r4-validator-7.0.6
      # The first run downloads FHIR packages and can take longer than the
      # 300 s timeout of one validator run, so fill the cache before the tests.
      - name: Warm the validator package cache
        run: java -jar validator_cli.jar fixtures/bundles/patient-a.json -version 4.0.1 -tx n/a -allow-example-urls true || true
      - name: Operators 9 and 14 are caught only by the strict layer
        env:
          RECORDCHAOS_VALIDATOR_JAR: ${{ github.workspace }}/validator_cli.jar
        run: cargo test -p recordchaos-core --test operator_gold -- --nocapture
