# cargo-about configuration for the third-party licence file that ships with
# the release binaries. Generate it with:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
# The release build does this before `dist build` (.github/build-setup.yml),
# and dist copies the file into every archive (dist-workspace.toml `include`).
# The file is generated, so it is not committed (.gitignore).
#
# `accepted` is the same list as `[licenses] allow` in deny.toml. A crate
# under any other licence makes generation fail, as it fails `cargo deny`.
# Keep the two lists identical.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# The release targets in dist-workspace.toml.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Only what is compiled into the binaries: no dev-dependencies. Build
# dependencies are kept, since their output can end up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# The Python bindings crate (publish = false) is not part of the binaries.
private = { ignore = true }
# ring's licence files need cargo-about's built-in clarification.
workarounds = ["ring"]
