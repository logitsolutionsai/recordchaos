# dist (cargo-dist) release configuration. Generate the release workflow with
# `dist init` / `dist generate` after installing dist 0.34; it writes
# .github/workflows/release.yml. Nothing is published until a tag is pushed.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
tap = "logitsolutionsai/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
pr-run-mode = "plan"
# Third-party licences ship in every archive. The file is generated by
# cargo-about in the release build, before `dist build`, from the steps in
# .github/build-setup.yml (the path is relative to .github/workflows).
# Locally, run `cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html`
# before `dist build`.
include = ["THIRD-PARTY-LICENSES.html"]
github-build-setup = "../build-setup.yml"
